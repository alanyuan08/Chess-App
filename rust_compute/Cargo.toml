[package]
name = "rust_compute"
version = "0.1.0"
edition = "2021"
rand = "0.9"

[profile.release]
debug = true

[build]
# Forces the compiler to auto-vectorize loops into AVX2 / Neon SIMD registers
rustflags = ["-C", "target-cpu=native"]

[dependencies]
const-random = "0.1"
rand = "0.10.1"
arrayvec = "0.7"
crossbeam-channel = "0.5"
polyglot = "0.1" 

[dependencies.pyo3]
version = "0.27.0"
# "abi3-py38" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.8
features = ["abi3-py38"]

[lib]
name = "rust_compute"
crate-type = ["cdylib"]
