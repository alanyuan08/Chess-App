[project]
name = "chessApp"
version = "0.1.0"
dependencies = [
    "PySide6",
    "py-spy"
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust_compute/Cargo.toml"

[project.optional-dependencies]
training = [
    "numpy",
    "tensorflow",
    "keras",
    "datasets",
    "chess",
    "pandas",
    "polars"
]
